name: Tests

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main", "fix/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: npm test
      - name: Validate game data
        run: npm run validate:data
